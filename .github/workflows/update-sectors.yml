name: Update Sector Data

# GitHub Actions cron is UTC-only and can be congested at :00/:30. The regular
# half-hour schedule is deliberately offset to :07/:37. Each scheduled slot is
# intentional: if GitHub starts it late, the updater completes the full sync
# even outside cash-market hours. It skips only dates when the NYSE is closed.
#
# The 4:17 PM ET run remains the preferred timely settled-close capture for the
# authoritative daily close (and Friday weekly close). A delayed start still
# runs rather than being discarded by a time-of-day gate.

on:
  schedule:
    # Intraday: every 30 minutes during the NYSE/Nasdaq cash session, DST-safe.
    - cron: '7,37 13-20 * * 1-5'
    - cron: '7 21 * * 1-5'
    # One settled-close write: 16:17 America/New_York (EDT / EST).
    - cron: '17 20 * * 1-5'
    - cron: '17 21 * * 1-5'
  workflow_dispatch:

jobs:
  update-sectors:
    # Never cancel a started close sync in favour of a later dispatch.
    concurrency:
      group: eagleview-sector-data-sync
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-eagleview
      - run: pip install yfinance pandas requests pandas_market_calendars
      - name: Run sector update
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/update_sectors.py
