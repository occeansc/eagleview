name: Update Sector Data

# TRIGGERING
# GitHub's own cron is best-effort on shared runners: slots are routinely
# delayed by hours or dropped entirely, which left the market session without
# updates and then fired a burst of late runs overnight. The sync is therefore
# started by an external scheduler (cron-job.org, America/New_York time zone)
# that calls the workflow_dispatch API with  inputs.trigger = "external".
#
#   POST https://api.github.com/repos/occeansc/eagleview/actions/workflows/update-sectors.yml/dispatches
#   body: {"ref":"main","inputs":{"trigger":"external"}}
#
# External runs behave like scheduled runs: scripts/update_sectors.py skips NYSE
# holidays for them. A run started by hand from the Actions tab (trigger left at
# its default, "manual") still syncs unconditionally, exactly as before.
#
# The GitHub cron below is deliberately DISABLED so that it cannot double-fire
# alongside the external scheduler or add late overnight syncs. To fall back to
# GitHub-only scheduling, uncomment the `schedule:` block (and pause the
# external jobs).

on:
  # schedule:
  #   # Intraday: every 30 minutes during the NYSE/Nasdaq cash session, DST-safe.
  #   - cron: '7,37 13-20 * * 1-5'
  #   - cron: '7 21 * * 1-5'
  #   # One settled-close write: 16:17 America/New_York (EDT / EST).
  #   - cron: '17 20 * * 1-5'
  #   - cron: '17 21 * * 1-5'
  workflow_dispatch:
    inputs:
      trigger:
        description: 'Who started this run: "manual" (default) or "external" (scheduler)'
        required: false
        default: 'manual'
        type: string

jobs:
  update-sectors:
    # Never cancel a started close sync in favour of a later dispatch.
    concurrency:
      group: eagleview-sector-data-sync
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-eagleview
      - run: pip install yfinance pandas requests pandas_market_calendars
      - name: Run sector update
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EAGLEVIEW_TRIGGER:    ${{ github.event.inputs.trigger }}
        run: python scripts/update_sectors.py
